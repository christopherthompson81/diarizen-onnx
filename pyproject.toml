[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diarizen-onnx"
version = "0.1.0"
description = "Minimal ONNX Runtime reference implementation of the DiariZen-style diarization pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Christopher Thompson" }
]
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.11",
  "soundfile>=0.12",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.17"]
cuda = ["onnxruntime-gpu>=1.17"]
export = [
  "accelerate==1.6.0",
  "asteroid-filterbanks>=0.4.0",
  "einops>=0.6.0",
  "huggingface_hub>=0.23",
  "lightning>=2.0.1",
  "omegaconf>=2.1,<3.0",
  "onnx>=1.16",
  "onnxscript>=0.1",
  "onnxruntime>=1.17",
  "psutil>=5.9",
  "pyannote.core==5.0.0",
  "pyannote.database==5.1.3",
  "pyannote.metrics==3.2.1",
  "pyannote.pipeline==3.0.1",
  "pytorch_metric_learning>=2.1.0",
  "rich>=12.0.0",
  "semver>=3.0.0",
  "speechbrain>=0.5.14",
  "tensorboardX>=2.6",
  "toml>=0.10",
  "torch>=2.1",
  "torch_audiomentations>=0.11.0",
  "torchaudio>=2.1",
]
dev = [
  "build>=1.2",
]

[project.scripts]
diarizen-onnx = "diarizen_onnx.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
